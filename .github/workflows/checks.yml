name: Offline application checks

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: timeweb-api/package-lock.json
      - name: Install locked API test dependencies without lifecycle scripts
        run: npm ci --prefix timeweb-api --ignore-scripts
      - name: Check browser script syntax
        run: |
          node --check public/app.js
          node --check public/config.js
      - name: Run isolated application and API tests
        run: node --test
